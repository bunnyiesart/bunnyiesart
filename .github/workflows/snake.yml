name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#e8223a&color_dots=#fbeff3,#ffc9dc,#ff8fb3,#ff4f7e,#e8223a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#4a1c2a,#8a2a47,#d23a66,#ff6f96

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
