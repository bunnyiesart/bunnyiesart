<svg xmlns="http://www.w3.org/2000/svg" width="818" height="1008" viewBox="0 0 818 1008">
<style>
  text { font-family: 'DejaVu Sans Mono','Menlo','Consolas','Liberation Mono',monospace; font-size: 16px; fill: #aaaaaa; white-space: pre; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
